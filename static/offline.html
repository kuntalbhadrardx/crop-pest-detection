<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crop Doctor — Offline</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#0f1720; color:#e6edf3;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align:center; padding:24px; }
  .box { max-width: 420px; }
  .leaf { font-size: 56px; }
  h1 { font-size: 20px; margin: 10px 0 6px; }
  p { color:#93a4b5; font-size: 14px; line-height:1.6; margin: 6px 0 18px; }
  button { font:inherit; font-size:14px; font-weight:600; color:#0b1220; background:#38bdf8;
           border:none; border-radius:9px; padding:10px 18px; cursor:pointer; }
</style>
</head>
<body>
  <div class="box">
    <div class="leaf">🌾</div>
    <h1>You're offline</h1>
    <p>This page hasn't been cached yet. Reconnect once, open the app, and after that
       Crop Doctor will keep working with no signal — scans taken offline are saved
       on the device and sync automatically later.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
